{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <h1 class="card-title">Delete Meal Entry?</h1>

        <p>Are you sure you want to delete the:
          <strong>{{ mealentry }}</strong>?</p>

        <form method="post">
          {% csrf_token %}

          <button type="submit" class="btn btn-danger">
            Yes, delete
          </button>

          <a href="{% url 'tracker:meal-list' %}" class="btn btn-secondary">Cancel</a>

        </form>
      </div>
    </div>
  </div>

{% endblock %}
